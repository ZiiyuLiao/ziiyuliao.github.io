    function renderSparkline(trend, refPrice, isUp, isDown) {
      if (!trend || trend.length < 2) return "";
      var prices = trend.map(function(p){ return parseFloat(p); }).filter(function(p){ return !isNaN(p) && p > 0; });
      if (prices.length < 2) return "";
      var ref = parseFloat(refPrice) || prices[0];
      var maxP = Math.max.apply(null, prices);
      var minP = Math.min.apply(null, prices);
      var diff = Math.max(Math.abs(maxP - ref), Math.abs(minP - ref));
      if (diff === 0) diff = ref * 0.005;
      var yMin = ref - diff, yMax = ref + diff;
      var w = 100, h = 36;
      var isPaper = (typeof themeMode !== "undefined" && themeMode === "paper");
      var strokeColor = isUp ? (isPaper ? "#a1402f" : "#ff5252") : (isDown ? (isPaper ? "#3f6b4a" : "#4caf50") : "#94a3b8");
      var refLineColor = isPaper ? "#c9b98f" : "#374151";
      var refY = h - ((ref - yMin) / (yMax - yMin) * h);
      var pts = [];
      for (var i = 0; i < prices.length; i++) {
        var x = (i / (prices.length - 1)) * w;
        var y = h - ((prices[i] - yMin) / (yMax - yMin) * h);
        pts.push(x.toFixed(1) + "," + y.toFixed(1));
      }
      return '<svg viewBox="0 0 ' + w + ' ' + h + '"><line x1="0" y1="' + refY.toFixed(1) + '" x2="' + w + '" y2="' + refY.toFixed(1) + '" stroke="' + refLineColor + '" stroke-dasharray="2,2" stroke-width="1"/><polyline fill="none" stroke="' + strokeColor + '" stroke-width="2" points="' + pts.join(" ") + '"/></svg>';
    }

    /* ★ 收益四段階梯色階判定 ★ */
    function getPnlTier(pnlRateStr) {
      if (!pnlRateStr || pnlRateStr === "-") {
        return { badgeClass: "pnl-badge-flat", textClass: "text-flat" };
      }
      var s = String(pnlRateStr).replace(/[%+,\s]/g, "");
      var num = parseFloat(s);
      if (isNaN(num) || num === 0) {
        return { badgeClass: "pnl-badge-flat", textClass: "text-flat" };
      }
      if (num >= 15.0) {
        return { badgeClass: "pnl-badge-deep-up", textClass: "text-deep-up" };
      } else if (num > 0) {
        return { badgeClass: "pnl-badge-light-up", textClass: "text-light-up" };
      } else if (num > -15.0) {
        return { badgeClass: "pnl-badge-light-down", textClass: "text-light-down" };
      } else {
        return { badgeClass: "pnl-badge-deep-down", textClass: "text-deep-down" };
      }
    }

    function getActionClass(action) {
      if (!action) return "act-default";
      if (action.indexOf("買") !== -1 || action.indexOf("加碼") !== -1) return "act-buy";
      if (action.indexOf("續抱") !== -1) return "act-hold";
      if (action.indexOf("賣") !== -1 || action.indexOf("減碼") !== -1) return "act-sell";
      return "act-default";
    }

    function toggleCompany(el) {
      var card = (el && el.closest) ? el.closest(".comp-card") : (document.getElementById("comp-card-" + el) || el);
      if (!card) return;
      var key = card.getAttribute("data-comp-key") || card.id.replace("comp-card-", "");
      if (card.classList.contains("expanded")) {
        card.classList.remove("expanded");
        if (key) delete expandedCompanyKeys[key];
      } else {
        card.classList.add("expanded");
        if (key) expandedCompanyKeys[key] = true;
      }
      try {
        localStorage.setItem("APP_EXPANDED_COMPANIES", JSON.stringify(expandedCompanyKeys));
      } catch (e) {}
    }

        } else {

    /* ★ 讀取資料：scope = "holdings" 只抓我的持股頁所需資料；其他 = 全部 ★ */
    /* pocket 省略時預設用目前畫面的 currentPocket，「全部更新」會明確指定 "1"/"2" 各抓一次 */
    function requestData(force, scope, pocket, onOk, onFail) {
      var pk = pocket || currentPocket;
      if (IS_GAS) {
        google.script.run
          .withSuccessHandler(function(d) { if (d) onOk(d); else onFail("empty"); })
          .withFailureHandler(function() { onFail("network"); })
          .getMobileWatchlistData(force === true, scope || "", pk);
      } else if (apiCfg.url && apiCfg.token) {
        var u = apiCfg.url + (apiCfg.url.indexOf("?") === -1 ? "?" : "&") + "api=json" +
          "&token=" + encodeURIComponent(apiCfg.token || "") + (force === true ? "&refresh=1" : "") +
          (scope ? "&scope=" + scope : "") + "&pocket=" + encodeURIComponent(pk || "1") + "&_=" + Date.now();
        fetch(u, { cache: "no-store" })
          .then(function(r) { return r.json(); })
          .then(function(d) { if (d && d.error) onFail("auth"); else onOk(d); })
          .catch(function() { onFail("network"); });
      } else {
        onFail("config");
      }
    }

    /* ★ 全部更新 (按鈕、首次載入)：持股、大盤、財報動態、績效全部重抓 ★
       強制刷新時，不管目前在看哪個錢袋，錢袋1、錢袋2 都會一起強制重新計算，
       這樣更新完之後不管切去哪個錢袋畫面都是最新的，不用各自再按一次 ★ */
    function fetchLatestData(force) {
      var btn = document.getElementById("btn-refresh");
      var icon = document.getElementById("btn-icon");
      var label = document.getElementById("time-label");
      icon.innerText = "⏳";
      label.innerText = "更新中...";
      btn.style.opacity = "0.7";

      function showResult(d) {
        btn.style.opacity = "1";
        currentData = d;
        cachePocketData(d);
        renderUI(d);
      }
      function showFail(reason) {
        btn.style.opacity = "1";
        if (reason === "config") { icon.innerText = "⚙️"; label.innerText = "尚未設定"; openSettings(); return; }
        icon.innerText = "❌";
        if (reason === "auth") { label.innerText = "權杖錯誤"; openSettings("權杖不正確，請重新輸入"); return; }
        label.innerText = "連線失敗";
      }

      if (force === true) {
        var results = {};
        var remaining = 2;
        var failReason = null;
        function done(pk, err, d) {
          if (!err) { results[pk] = d; cachePocketData(d); } else failReason = failReason || err;
          remaining--;
          if (remaining > 0) return;
          if (currentPocket === "1" || currentPocket === "2") {
            if (results[currentPocket]) showResult(results[currentPocket]);
            else showFail(failReason || "network");
            // 順便把「合計」也重新組合好放進快取，之後切過去才能秒切
            requestData(false, "", "combined", cachePocketData, function() {});
          } else {
            // 合計畫面：底層兩個錢袋的快取都剛被強制刷新過，這裡不用再強制，直接組合最新結果即可
            requestData(false, "", "combined", showResult, showFail);
          }
        }
        requestData(true, "", "1", function(d) { done("1", null, d); }, function(r) { done("1", r, null); });
        requestData(true, "", "2", function(d) { done("2", null, d); }, function(r) { done("2", r, null); });
      } else {
        requestData(force, "", currentPocket, showResult, showFail);
      }
    }

    /* ★ 盤中自動更新：只更新「我的持股」(大盤、帳戶總覽、持股清單) ★ */
    var autoBusy = false;
    function refreshHoldings() {
      if (autoBusy) return;
      autoBusy = true;
      requestData(false, "holdings", currentPocket, function(d) {
        autoBusy = false;
        if (!currentData) currentData = {};
        ["updateTime", "portfolio", "market", "stocks", "marketClosedToday", "intraday"].forEach(function(k) {
          if (d[k] !== undefined) currentData[k] = d[k];
        });
        cachePocketData(currentData);
        renderUI(currentData, true);
      }, function() { autoBusy = false; });
    }

    /* 台北時間是否在盤中 (週一~五 09:00~13:50)；今日確定休市則不更新。
       13:50 (而非 13:30/13:35) 是配合後端同步截止點延後的理由：VIX 在收盤前後官方報價
       本身會有一段修正，太早停止自動刷新會讓網頁卡在修正前的舊數字。 */
    function taipeiNow() {
      var n = new Date();
      return new Date(n.getTime() + n.getTimezoneOffset() * 60000 + 8 * 3600000);
    }
    // 註：這裡只看「行事曆」(週一~五 09:00~13:35)，故意不檢查 marketClosedToday。
    // 原因：如果拿 currentData.marketClosedToday 當作「要不要繼續自動刷新」的條件，
    // 一旦某次讀到的資料裡這個欄位剛好是 true (例如頁面一開始載入時剛好卡到舊狀態)，
    // 之後就再也不會呼叫 refreshHoldings() 去要新資料──而這個欄位本身只有重新要資料
    // 才會更新，等於整個自動刷新永遠卡死，必須手動重新整理網頁才能恢復。
    // 把「是否自動刷新」跟「是否顯示休市」分開，才不會互相卡住。
    function isMarketHours() {
      var t = taipeiNow();
      var dow = t.getDay(), hm = t.getHours() * 100 + t.getMinutes();
      if (dow === 0 || dow === 6) return false;
      if (hm < 900 || hm > 1350) return false;
      return true;
    }
    function updateAutoBadge() {
      var b = document.getElementById("auto-badge");
      if (!b) return;
      if (!isMarketHours()) { b.className = "auto-badge"; b.innerText = "● 非盤中"; }
      else if (currentData && currentData.marketClosedToday) { b.className = "auto-badge"; b.innerText = "● 今日休市"; }
      else { b.className = "auto-badge on"; b.innerText = "● 盤中自動"; }
    }

    /* ★ 獨立網頁版連線設定：支援網址 #api=...&token=... 一次帶入 ★ */
    var IS_GAS = (typeof google !== "undefined" && google.script && google.script.run);
    var apiCfg = { url: FIXED_API_URL || lsGet("APP_API_URL", ""), token: lsGet("APP_API_TOKEN", "") };
    function readHashConfig() {
      if (!location.hash || location.hash.length < 2) return false;
      var params = {};
      location.hash.slice(1).split("&").forEach(function(kv) {
        var i = kv.indexOf("=");
        if (i > 0) params[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
      });
      if (params.api && !FIXED_API_URL) { apiCfg.url = params.api; lsSet("APP_API_URL", params.api); }
      if (params.token) { apiCfg.token = params.token; lsSet("APP_API_TOKEN", params.token); }
      try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
      return !!(params.api || params.token);
    }
    readHashConfig();
    window.addEventListener("hashchange", function() {
      if (readHashConfig()) { closeSettings(); fetchLatestData(false); }
    });

    function openSettings(msg) {
      document.getElementById("settings-box").style.display = "block";
      document.getElementById("cfg-url").value = apiCfg.url || "";
      document.getElementById("cfg-url").style.display = FIXED_API_URL ? "none" : "";
      document.getElementById("cfg-token").value = apiCfg.token || "";
      document.getElementById("cfg-msg").innerText = msg || "";
    }
    function closeSettings() { document.getElementById("settings-box").style.display = "none"; }
    function saveSettings() {
      apiCfg.url = FIXED_API_URL || document.getElementById("cfg-url").value.trim();
      apiCfg.token = document.getElementById("cfg-token").value.trim();
      lsSet("APP_API_URL", apiCfg.url);
      lsSet("APP_API_TOKEN", apiCfg.token);
      closeSettings();
      fetchLatestData(false);
    }

    if (!IS_GAS) document.getElementById("btn-settings").style.display = "";

    renderPocketSwitch();
    if (currentData && currentData.pocket === currentPocket) { cachePocketData(currentData); renderUI(currentData); }
    else fetchLatestData(false);
    // 背景偷偷把其他錢袋的資料也先抓好，之後切換就能秒切畫面不用等
    setTimeout(prefetchOtherPockets, 1500);
    /* 自動刷新讀取伺服器快取 (試算表約每分鐘才更新一次)；手動按鈕才強制刷新 */
    /* 每 30 秒檢查一次：盤中、頁面在前景、已設定連線時，才自動更新「我的持股」 */
    function canAutoRefresh() {
      var settingsOpen = document.getElementById("settings-box").style.display === "block";
      return isMarketHours() && document.visibilityState !== "hidden" && !settingsOpen &&
        (IS_GAS || (apiCfg.url && apiCfg.token));
    }
    setInterval(function() {
      updateAutoBadge();
      if (canAutoRefresh()) refreshHoldings();
    }, 30000);
    document.addEventListener("visibilitychange", function() {
      if (document.visibilityState === "visible" && canAutoRefresh()) refreshHoldings();
    });
  </script>
</body>
</html>
